<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动物计时提醒器</title>
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <!-- 主界面 -->
  <div id="mainPage" class="page">
    <div class="container">
      <h1>动物计时提醒器</h1>
      <div class="toolbar">
        <button id="addBtn" type="button">添加</button>
        <button id="settingsBtn" type="button" class="secondary">设置</button>
        <button id="logBtn" type="button" class="secondary">日志</button>
      </div>

      <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>所属ID</th>
            <th>种类</th>
            <th>年龄</th>
            <th>下一阶段</th>
            <th>繁殖阶段</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <!-- 设置页面 -->
  <div id="settingsPage" class="page hidden">
    <div class="container">
      <div class="settings-header">
        <button id="backBtn" class="back-btn">&larr; 返回</button>
        <h1>设置</h1>
      </div>

      <div class="settings-section">
        <h3>提醒设置</h3>
        <div class="setting-item">
          <label>铃声提醒</label>
          <label class="switch">
            <input type="checkbox" id="ringtoneEnabled" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>铃声音量</label>
          <input type="range" id="ringtoneVolume" min="1" max="100" value="100">
        </div>
        <div class="setting-item">
          <label>铃声时长（秒）</label>
          <input type="number" id="ringtoneDuration" min="1" max="60" value="10">
        </div>
        <div class="setting-item">
          <label>喵提醒</label>
          <label class="switch">
            <input type="checkbox" id="miaoEnabled" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>系统通知</label>
          <label class="switch">
            <input type="checkbox" id="notificationEnabled" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>音频保活</label>
          <label class="switch">
            <input type="checkbox" id="audioKeepAlive" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>选择铃声</label>
          <select id="ringtoneSelect" style="width:auto;max-width:180px;font-size:13px;"></select>
        </div>
        <div class="setting-item">
          <label>提醒间隔（分钟）</label>
          <input type="number" id="remindInterval" min="1" max="1440" value="120" style="width:80px;padding:4px;text-align:center;">
        </div>
        <div class="setting-item">
          <label>免打扰开始（时）</label>
          <input type="number" id="quietStart" min="0" max="23" value="0" style="width:80px;padding:4px;text-align:center;">
        </div>
        <div class="setting-item">
          <label>免打扰结束（时）</label>
          <input type="number" id="quietEnd" min="0" max="23" value="8" style="width:80px;padding:4px;text-align:center;">
        </div>
      </div>

      <div class="settings-section">
        <h3>喵提醒链接</h3>
        <div id="miaoUrlList" class="miao-url-list"></div>
        <button id="addMiaoUrl" type="button" class="secondary add-btn-sm">+ 添加喵提醒链接</button>
      </div>

      <div class="settings-section">
        <h3>所属ID别名 <label style="font-weight:normal;font-size:13px;margin-left:12px;">ID数量</label> <input type="number" id="idCount" min="1" max="99" value="20" style="width:60px;padding:4px;text-align:center;"></h3>
        <div id="idListContainer" class="id-list id-alias-grid"></div>
      </div>

      <div class="settings-footer">
        <button id="saveSettings" type="button">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 日志页面 -->
  <div id="logPage" class="page hidden">
    <div class="container">
      <div class="settings-header">
        <button id="logBackBtn" class="back-btn">&larr; 返回</button>
        <h1>通知日志</h1>
        <button id="clearLogBtn" type="button" class="secondary" style="width:auto;font-size:12px;padding:4px 10px;">清空日志</button>
      </div>
      <div id="logContainer" class="log-list"></div>
    </div>
  </div>

  <script src="data.js?v=9"></script>
  <script src="app.js?v=16"></script>
  <div id="toast" class="toast"></div>
</body>
</html>
